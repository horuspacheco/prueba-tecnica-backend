version: '3.8'
services:
  postgres:
    image: postgres:15
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payments
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  payment-service:
    build: ./payment-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payments
    depends_on:
      postgres:
        condition: service_healthy
  api-gateway:
    build: ./api-gateway
    ports:
      - "3000:3000"
    environment:
      PAYMENT_SERVICE_URL: http://payment-service:3001
    depends_on:
      - payment-service
volumes:
  pgdata:
